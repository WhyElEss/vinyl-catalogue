{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{.Title}}</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3efe7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="description" content="{{.Description}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{.SiteName}}">
<meta property="og:title" content="{{.OGTitle}}">
<meta property="og:description" content="{{.Description}}">
<meta property="og:url" content="{{.OGURL}}">
<meta property="og:locale" content="en_US">
<meta property="og:image" content="{{.OGImage}}">
<meta property="og:image:type" content="{{.OGImageType}}">
<meta property="og:image:width" content="{{.OGImageW}}">
<meta property="og:image:height" content="{{.OGImageH}}">
<meta property="og:image:alt" content="{{.OGTitle}}">
<meta name="twitter:card" content="{{.TwitterCard}}">
<meta name="twitter:title" content="{{.OGTitle}}">
<meta name="twitter:description" content="{{.Description}}">
<meta name="twitter:image" content="{{.OGImage}}">
<link rel="icon" href="/static/icon.svg?v={{.Version}}" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v={{.Version}}">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<script src="/static/theme.js?v={{.Version}}"></script>
<link rel="stylesheet" href="/static/style.css?v={{.Version}}">
</head>
<body>
<header class="top">
  <a class="brand" href="/">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text"><span class="brand-name">{{if .OwnerName}}{{.OwnerName}}{{else}}{{t "collection"}}{{end}}</span><span class="brand-sub">{{if .OwnerName}}{{t "collection"}} · {{end}}{{count .Count}}</span></span>
  </a>
  <div class="top-actions">
    <button type="button" class="icon-btn" id="theme-btn" data-auto="{{t "theme_auto"}}" data-light="{{t "theme_light"}}" data-dark="{{t "theme_dark"}}" aria-label="{{t "theme_auto"}}" title="{{t "theme_auto"}}">
      <svg class="i-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="fill"/></svg>
      <svg class="i-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>
{{template "main" .}}
<footer class="foot">
  <span>{{t "attribution"}}</span>
</footer>
</body>
</html>{{end}}
